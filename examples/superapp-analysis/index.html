<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>按需分析与调查</title><link rel="stylesheet" href="/theme.css"><style>body{background:#edf2f6;color:#20394b;font:15px/1.7 system-ui;margin:0}main{max-width:1100px;margin:auto;padding:25px}select,button{padding:9px;margin:6px;border-radius:8px;border:1px solid #c2d0d9;background:white;color:#175b5a}article{background:white;padding:20px;border-radius:14px;margin:14px 0}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #ddd}.muted{color:#5d7182}#status{padding:12px}label{display:inline-block}button{cursor:pointer}pre{white-space:pre-wrap}</style><main><small>SUPERAPP 接入演示 · 合成数据 · 未连接 AI 服务</small><h1>从发现问题，到执行调查</h1><p>选择范围后更新分析。外接 AI 是可选能力，当前演示不模拟模型结论。</p><label>场景<select id="kind"><option value="overview">经营总览</option><option value="funnel">转化漏斗</option><option value="channels">渠道对比</option><option value="monitor">异常监控</option></select></label><label>范围<select id="scope"><option value="">全部分组</option><option>月球站</option><option>火星站</option><option>木星站</option></select></label><label>分析方式<select id="mode"><option value="local">本地诊断</option><option value="ai" disabled>AI 解释（未配置服务）</option></select></label><button id="refresh">更新分析</button><label><input id="auto" type="checkbox">每 30 秒更新</label><div id="status" role="status"></div><div id="result"></div></main><script src="/client.js"></script><script src="/app.js"></script></html>
